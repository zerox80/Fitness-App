import org.gradle.api.GradleException
import org.gradle.api.Project
import org.gradle.api.tasks.testing.Test
import org.gradle.testing.jacoco.plugins.JacocoPluginExtension
import org.gradle.testing.jacoco.tasks.JacocoReport

def coverageProjectPaths = [':app']
def coverageExcludes = [
  '**/R.class',
  '**/R$*.class',
  '**/BuildConfig.*',
  '**/Manifest*.*'
]

def configureCoverageReport
configureCoverageReport = { Project project ->
  project.pluginManager.apply('jacoco')
  project.extensions.configure(JacocoPluginExtension) {
    toolVersion = '0.8.12'
  }

  def testTaskName = 'testDebugUnitTest'
  def reportTaskName = 'jacocoDebugUnitTestReport'

  def testTask = project.tasks.findByName(testTaskName)
  if (testTask == null) {
    throw new GradleException("Android coverage report requires ${project.path}:${testTaskName}.")
  }

  project.tasks.withType(Test).configureEach {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
  }

  def sourceDirs = project.files('src/main/java', 'src/main/kotlin')
  def classDirs = project.files(
    project.fileTree(dir: "${project.buildDir}/intermediates/javac/debug/classes", excludes: coverageExcludes),
    project.fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: coverageExcludes)
  )
  def coverageData = project.fileTree(dir: project.buildDir, includes: [
    "jacoco/${testTaskName}.exec",
    "outputs/unit_test_code_coverage/debugUnitTest/${testTaskName}.exec"
  ])

  def reportTask = project.tasks.register(reportTaskName, JacocoReport) {
    dependsOn testTask
    reports {
      xml.required = true
      html.required = true
      csv.required = false
    }
    sourceDirectories.setFrom(sourceDirs)
    classDirectories.setFrom(classDirs)
    executionData.setFrom(coverageData)
  }

  testTask.finalizedBy(reportTask)
}

gradle.projectsEvaluated {
  coverageProjectPaths.each { projectPath ->
    def project = rootProject.findProject(projectPath)
    if (project == null) {
      throw new GradleException("Android coverage report requires ${projectPath}, but it was not found.")
    }
    configureCoverageReport(project)
  }
}
